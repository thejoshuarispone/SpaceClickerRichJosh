<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiger Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div id="toast" class="toast"></div>   

    <section class = "game-features">
        <h1 class="page-title">Tiger Clicker</h1>
        <img src="assets/steak.png" alt="" class="steak" onclick="earnPoints()">
        <div class="game-header">
    <p>Click the Steak to earn points!</p>

    <div class="points-box">
        Points: <span id="points">0</span>
    </div>

    <div class="persec-box">
        Per second: <span id="perSecond">0</span>
    </div>
</div>

         <p class="credit">Created by RichJosh</p>
    </section>
    
 <section class="game-screen"> 
    <div class="game-background"></div>

    <div class="earth-wrapper">
        <img src="assets/earth.png" alt="Earth" class="background-image">
        <img src="assets/tiger.png" alt="Tiger" class="tiger">
    </div>
    <div class="stats"><p>Stats will be displayed here</p></div>
</section>

    <section class="upgrade-section">
                    <h1 class="upgrade-title">Upgrades:</h1>
                    <button class="upgrade1" onclick="buyUpgrade1()">
                        <div class="upgrade-icon">
                         <img src="./assets/fangs.png" alt="Fangs Icon" class="fangs-icon"> 
                        </div>
                        <div class="upgrade-text">
                        Chomp Upgrade: 
                        <p><span id="upgradeCost">10</span> points</div></p>
                        <div class="upgrade-value"> 
                        LVL
                        </div>  
                    </button>

                    <button class="upgrade2" onclick="buyUpgrade2()">
                        <div class="upgrade-icon">
                         <img src="./assets/helmet.png" alt="Helmet Icon" class="helmet-icon"> 
                        </div>
                        <div class="upgrade-text">
                        Hungry Football Team: 
                        <p><span id="upgradeCost2">100</span> points</div></p>
                        <div class="upgrade-value"> 
                        LVL
                        </div>  
                    </button>

                    <button class="upgrade3" onclick="constantEarner1()">
                        <div class="upgrade-icon">
                         <img src="./assets/crowd.png" alt="Crowd Icon" class="crowd-icon"> 
                        </div>
                        <div class="upgrade-text">
                        Union Rush Hour: 
                        <p><span id="upgradeCost">10</span> points</div></p>
                        <div class="upgrade-value"> 
                        LVL
                        </div>  
                    </button>

                    <button class="upgrade4" onclick="constantEarner1()">
                        <div class="upgrade-icon">
                         <img src="./assets/fangs.png" alt="Fangs Icon" class="fangs-icon"> 
                        </div>
                        <div class="upgrade-text">
                        Upgrade 3: 
                        <p><span id="upgradeCost">10</span> points</div></p>
                        <div class="upgrade-value"> 
                        LVL
                        </div>    
                    </button>

                    <button class="suitChange" alt = "upgrade5" onclick="constantEarner1()">
                        <div class="upgrade-icon">
                         <img src="./assets/astronaut.png" alt="Astronaut Icon" class="astronaut-icon"> 
                        </div>
                        <div class="upgrade-text">
                        Space Suit Upgrade: 
                        <p><span id="upgradeCost">10</span> points</div></p>
                        <div class="upgrade-value"> 
                        LVL
                        </div>  
                    </button>

                    <button class="planetChange" alt = "upgrade6"onclick="planetChange()">
                       <div class="upgrade-icon">
                         <img src="./assets/planets.png" alt="Fangs Icon" class="fangs-icon"> 
                        </div>
                        <div class="upgrade-text">
                        Change Planet: 
                        <p><span id="upgradeCost">10</span> points</div></p>
                        <div class="upgrade-value"> 
                        LVL
                        </div>    
                    </button>

                    <button class="reset-button" alt = "upgrade7" onclick="resetGame()">
                        Reset Game
                    </button>

    </section>

</body>
</html>
